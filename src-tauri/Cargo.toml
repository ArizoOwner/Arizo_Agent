[package]
name = "arizo-agent"
version = "3.5.1"
description = "Arizo-Agent — a Dynamic Island translator and Spotify companion for Windows"
authors = ["ArizoOwner"]
edition = "2021"
license = "MIT"

[lib]
name = "arizo_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
ring = "0.17"
getrandom = "0.4"
regex = "1"
arboard = "3"

[target.'cfg(windows)'.dependencies]
windows-future = "0.2.1"
# The island page is drawn at the display scale only (platform::match_display_scale).
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.61", features = [
  "Foundation",
  "Media",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# A small, fast-starting binary.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Tests only: a fake AI server on localhost (aphra.rs).
[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread"] }
