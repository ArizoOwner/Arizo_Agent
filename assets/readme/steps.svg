<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Download, run, meet Ari, press Alt+D">

<style>
  text{font-family:'Segoe UI','Inter',system-ui,-apple-system,Arial,sans-serif}
  .float{animation:float 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.972)}}
  .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
  @keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
  .look{animation:look 9s ease-in-out infinite}
  @keyframes look{0%,100%{transform:translate(0,0)}15%{transform:translate(-14px,3px)}35%{transform:translate(12px,-3px)}55%{transform:translate(0,6px)}75%{transform:translate(8px,2px)}}
  .spark{transform-box:fill-box;transform-origin:center;animation:spark 3s ease-in-out infinite}
  @keyframes spark{0%,100%{transform:scale(.2) rotate(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}
  .drift{animation:drift 7s ease-in-out infinite}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-14px)}}
  .twinkle{animation:twinkle 4s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
  .pair{transform-box:fill-box;transform-origin:center;animation:pair 9s infinite both;opacity:0}
  @keyframes pair{0%{opacity:0;transform:scale(.7) translateY(10px)}4%{opacity:1;transform:scale(1.04) translateY(0)}6%{transform:scale(1)}29%{opacity:1;transform:scale(1)}33%{opacity:0;transform:scale(.9) translateY(-8px)}100%{opacity:0}}

  .st{opacity:0;animation:st 8s ease-out infinite both}
  @keyframes st{0%{opacity:0;transform:translateY(14px)}8%,94%{opacity:1;transform:translateY(0)}100%{opacity:1}}
  .arrow{animation:arrow 1.4s ease-in-out infinite}
  @keyframes arrow{0%,100%{transform:translateX(-3px);opacity:.35}50%{transform:translateX(4px);opacity:1}}
</style>
<rect width="1200" height="210" rx="26" fill="#0b0b13" stroke="#ffffff14"/>

  <g transform="translate(40 36)"><g class="st" style="animation-delay:0.0s">
    <rect width="250" height="138" rx="22" fill="#12121c" stroke="#3b82f6" stroke-opacity=".45"/>
    <circle cx="40" cy="40" r="22" fill="#3b82f6"/><text x="40" y="48" text-anchor="middle" font-size="22" font-weight="900" fill="#0b0b12">1</text>
    <text x="226" y="52" text-anchor="end" font-size="30" style="font-family:'Segoe UI Emoji','Apple Color Emoji',sans-serif">⬇️</text>
    <text x="24" y="86" font-size="20" font-weight="800" fill="#fff">Download</text>
    <text x="226" y="86" text-anchor="end" font-size="14" fill="#3b82f6" style="font-family:Vazirmatn,Tahoma,'Segoe UI',sans-serif">دانلود</text>
    <text x="24" y="108" font-size="12.5" fill="#aab0c8">Installer or portable exe from</text><text x="24" y="125" font-size="12.5" fill="#aab0c8">Releases</text>
  </g></g>
  <g transform="translate(310 105)"><path class="arrow" d="M-8-8 L6 0 -8 8" fill="none" stroke="#ffffff55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.0s"/></g>
  <g transform="translate(330 36)"><g class="st" style="animation-delay:0.6s">
    <rect width="250" height="138" rx="22" fill="#12121c" stroke="#a78bfa" stroke-opacity=".45"/>
    <circle cx="40" cy="40" r="22" fill="#a78bfa"/><text x="40" y="48" text-anchor="middle" font-size="22" font-weight="900" fill="#0b0b12">2</text>
    <text x="226" y="52" text-anchor="end" font-size="30" style="font-family:'Segoe UI Emoji','Apple Color Emoji',sans-serif">▶️</text>
    <text x="24" y="86" font-size="20" font-weight="800" fill="#fff">Run</text>
    <text x="226" y="86" text-anchor="end" font-size="14" fill="#a78bfa" style="font-family:Vazirmatn,Tahoma,'Segoe UI',sans-serif">اجرا</text>
    <text x="24" y="108" font-size="12.5" fill="#aab0c8">No administrator rights, no</text><text x="24" y="125" font-size="12.5" fill="#aab0c8">account</text>
  </g></g>
  <g transform="translate(600 105)"><path class="arrow" d="M-8-8 L6 0 -8 8" fill="none" stroke="#ffffff55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.3s"/></g>
  <g transform="translate(620 36)"><g class="st" style="animation-delay:1.2s">
    <rect width="250" height="138" rx="22" fill="#12121c" stroke="#fbbf24" stroke-opacity=".45"/>
    <circle cx="40" cy="40" r="22" fill="#fbbf24"/><text x="40" y="48" text-anchor="middle" font-size="22" font-weight="900" fill="#0b0b12">3</text>
    <text x="226" y="52" text-anchor="end" font-size="30" style="font-family:'Segoe UI Emoji','Apple Color Emoji',sans-serif">👋</text>
    <text x="24" y="86" font-size="20" font-weight="800" fill="#fff">Meet Ari</text>
    <text x="226" y="86" text-anchor="end" font-size="14" fill="#fbbf24" style="font-family:Vazirmatn,Tahoma,'Segoe UI',sans-serif">آری را ببینید</text>
    <text x="24" y="108" font-size="12.5" fill="#aab0c8">He lives at the top of your</text><text x="24" y="125" font-size="12.5" fill="#aab0c8">screen</text>
  </g></g>
  <g transform="translate(890 105)"><path class="arrow" d="M-8-8 L6 0 -8 8" fill="none" stroke="#ffffff55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.6s"/></g>
  <g transform="translate(910 36)"><g class="st" style="animation-delay:1.8s">
    <rect width="250" height="138" rx="22" fill="#12121c" stroke="#1DB954" stroke-opacity=".45"/>
    <circle cx="40" cy="40" r="22" fill="#1DB954"/><text x="40" y="48" text-anchor="middle" font-size="22" font-weight="900" fill="#0b0b12">4</text>
    <text x="226" y="52" text-anchor="end" font-size="30" style="font-family:'Segoe UI Emoji','Apple Color Emoji',sans-serif">✨</text>
    <text x="24" y="86" font-size="20" font-weight="800" fill="#fff">Press Alt+D</text>
    <text x="226" y="86" text-anchor="end" font-size="14" fill="#1DB954" style="font-family:Vazirmatn,Tahoma,'Segoe UI',sans-serif">Alt+D</text>
    <text x="24" y="108" font-size="12.5" fill="#aab0c8">Translate, play music, watch</text><text x="24" y="125" font-size="12.5" fill="#aab0c8">the market</text>
  </g></g>
  
</svg>
