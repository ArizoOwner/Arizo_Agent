<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="For developers">

<defs>
  <linearGradient id="bgdev" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa" stop-opacity=".28"/><stop offset=".6" stop-color="#0d0d16"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".25"/></linearGradient>
  <linearGradient id="lndev" x1="0" x2="1"><stop offset="0" stop-color="#60a5fa" stop-opacity="0"/><stop offset=".4" stop-color="#60a5fa"/><stop offset=".6" stop-color="#a78bfa"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
  <filter id="gldev" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<style>
  text{font-family:'Segoe UI','Inter',system-ui,-apple-system,Arial,sans-serif}
  .float{animation:float 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.972)}}
  .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
  @keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
  .look{animation:look 9s ease-in-out infinite}
  @keyframes look{0%,100%{transform:translate(0,0)}15%{transform:translate(-14px,3px)}35%{transform:translate(12px,-3px)}55%{transform:translate(0,6px)}75%{transform:translate(8px,2px)}}
  .spark{transform-box:fill-box;transform-origin:center;animation:spark 3s ease-in-out infinite}
  @keyframes spark{0%,100%{transform:scale(.2) rotate(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}
  .drift{animation:drift 7s ease-in-out infinite}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-14px)}}
  .twinkle{animation:twinkle 4s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
  .pair{transform-box:fill-box;transform-origin:center;animation:pair 9s infinite both;opacity:0}
  @keyframes pair{0%{opacity:0;transform:scale(.7) translateY(10px)}4%{opacity:1;transform:scale(1.04) translateY(0)}6%{transform:scale(1)}29%{opacity:1;transform:scale(1)}33%{opacity:0;transform:scale(.9) translateY(-8px)}100%{opacity:0}}

  .sweep{animation:sweep 6s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-120px)}100%{transform:translateX(1320px)}}
  .icon{transform-box:fill-box;transform-origin:center;animation:icon 3.2s ease-in-out infinite}
  @keyframes icon{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
</style>
<rect width="1200" height="120" rx="26" fill="#0d0d16"/><rect width="1200" height="120" rx="26" fill="url(#bgdev)" stroke="#ffffff16"/>
<circle class="twinkle" style="animation-delay:0.96s" cx="440" cy="4" r="0.9" fill="#fff"/><circle class="twinkle" style="animation-delay:1.53s" cx="713" cy="62" r="1.7" fill="#fff"/><circle class="twinkle" style="animation-delay:2.45s" cx="325" cy="29" r="2.2" fill="#fff"/><circle class="twinkle" style="animation-delay:1.34s" cx="368" cy="90" r="0.9" fill="#fff"/><circle class="twinkle" style="animation-delay:2.18s" cx="593" cy="116" r="1.2" fill="#fff"/><circle class="twinkle" style="animation-delay:3.27s" cx="355" cy="53" r="0.9" fill="#fff"/><circle class="twinkle" style="animation-delay:1.68s" cx="681" cy="21" r="2.0" fill="#fff"/><circle class="twinkle" style="animation-delay:0.69s" cx="650" cy="47" r="2.1" fill="#fff"/><circle class="twinkle" style="animation-delay:3.72s" cx="784" cy="91" r="1.8" fill="#fff"/><circle class="twinkle" style="animation-delay:3.55s" cx="44" cy="91" r="1.2" fill="#fff"/><circle class="twinkle" style="animation-delay:0.06s" cx="913" cy="37" r="1.5" fill="#fff"/><circle class="twinkle" style="animation-delay:1.32s" cx="184" cy="103" r="1.2" fill="#fff"/><circle class="twinkle" style="animation-delay:3.47s" cx="920" cy="54" r="1.5" fill="#fff"/><circle class="twinkle" style="animation-delay:2.02s" cx="995" cy="66" r="1.6" fill="#fff"/><circle class="twinkle" style="animation-delay:0.00s" cx="308" cy="85" r="1.1" fill="#fff"/><circle class="twinkle" style="animation-delay:3.71s" cx="664" cy="17" r="1.2" fill="#fff"/><circle class="twinkle" style="animation-delay:1.46s" cx="209" cy="1" r="1.6" fill="#fff"/><circle class="twinkle" style="animation-delay:2.02s" cx="219" cy="105" r="0.8" fill="#fff"/>
<g transform="translate(78 60)"><circle r="38" fill="#60a5fa" opacity=".16"/><circle r="38" fill="none" stroke="#60a5fa" stroke-opacity=".6" stroke-width="2"/>
  <g class="icon"><text y="13" text-anchor="middle" font-size="38" style="font-family:'Segoe UI Emoji','Apple Color Emoji',sans-serif">🛠️</text></g></g>
<text x="142" y="62" font-size="38" font-weight="800" fill="#fff">For developers</text>
<text x="142" y="92" font-size="16" fill="#aab0c8">Rust + Tauri 2 + TypeScript — build it yourself in three commands</text>
<text x="1140" y="62" text-anchor="end" font-size="34" font-weight="800" fill="#fff" style="font-family:Vazirmatn,Tahoma,'Segoe UI',sans-serif">برای توسعه‌دهندگان</text>
<rect x="60" y="112" width="1080" height="2.5" rx="1.2" fill="url(#lndev)" opacity=".8"/>
<g clip-path="inset(0)"><circle class="sweep" cx="0" cy="113" r="6" fill="#fff" filter="url(#gldev)"/></g>
</svg>
