<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Visit the official website — arizoteam.ir">
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-.3 0;.3 0;-.3 0" dur="6s" repeatCount="indefinite"/></linearGradient>
  <linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>
  <clipPath id="pill"><rect x="320" y="33" width="560" height="84" rx="42"/></clipPath>
</defs>
<style>
  .arrow { animation: nudge 1.6s ease-in-out infinite; transform-box: fill-box; }
  @keyframes nudge { 0%, 100% { transform: translateX(0) } 50% { transform: translateX(7px) } }
  .halo { animation: breathe 3.2s ease-in-out infinite; transform-origin: 600px 75px; }
  @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.96) } 50% { opacity: .9; transform: scale(1.03) } }
  @media (prefers-reduced-motion: reduce) { .arrow, .halo, animate, animateTransform { animation: none } }
</style>
<rect class="halo" x="340" y="41" width="520" height="76" rx="42" fill="url(#g)" filter="url(#glow)"/>
<rect x="320" y="33" width="560" height="84" rx="42" fill="url(#g)"/>
<g clip-path="url(#pill)"><rect x="-200" y="33" width="180" height="84" fill="url(#sweep)" transform="skewX(-20)">
  <animate attributeName="x" values="60;1000" dur="3.4s" repeatCount="indefinite"/></rect></g>
<rect x="321" y="34" width="558" height="82" rx="41" fill="none" stroke="#fff" stroke-opacity=".28"/>
<text x="600" y="69" text-anchor="middle" font-size="22" font-weight="800" fill="#fff"  style="font-family:'Segoe UI','Inter',system-ui,-apple-system,Arial,sans-serif">Visit the official website</text>
<text x="600" y="96" text-anchor="middle" font-size="18" font-weight="600" fill="#fff" fill-opacity=".85" style="font-family:'Segoe UI','Inter',system-ui,-apple-system,Arial,sans-serif">arizoteam.ir</text>
<g class="arrow"><path d="M818 75 h22 m-9 -10 l10 10 l-10 10" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
